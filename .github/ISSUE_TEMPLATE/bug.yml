name: Fallo
description: Algo no funciona en la app o en las herramientas
title: "[fallo] "
labels: ["bug"]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué pasó y qué esperabas
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir la app en modo avión\n2. …"
    validations:
      required: true
  - type: input
    id: telefono
    attributes:
      label: Teléfono, sistema y navegador
      placeholder: "iPhone 12, iOS 18, Safari (instalada en inicio)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión (Ajustes → VERSION del service worker)
      placeholder: v16-2026-11-24
  - type: dropdown
    id: senal
    attributes:
      label: ¿Con o sin señal?
      options: ["modo avión", "con señal", "no sé"]
  - type: checkboxes
    id: seguridad
    attributes:
      label: Seguridad
      options:
        - label: Afecta a emergencias, comer plantas o el volcán (P0 inmediato)
