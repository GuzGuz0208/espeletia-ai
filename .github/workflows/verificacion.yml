name: verificacion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contratos:
    name: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: jsonschema==4.26.0"
      - name: Contratos del Paquete Páramo
        run: python herramientas/validar_contratos.py
      - name: Modelos congelados (SHA-256)
        run: python herramientas/verificar_modelos.py
      - name: Versión del service worker
        env:
          EVENTO: ${{ github.event_name }}
          RAMA_BASE: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then BASE="origin/$RAMA_BASE"; else BASE="$ANTES"; fi
          python herramientas/version_sw.py --check --base "$BASE"
      - name: Índices generados al día
        run: python herramientas/generar_indices.py --check

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: herramientas/requirements.txt
      - run: "pip install --only-binary=:all: -r herramientas/requirements.txt"
      - name: Bancos del chat y puerta de seguridad
        run: python herramientas/evaluar.py --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals
          path: evals.json
          if-no-files-found: ignore
